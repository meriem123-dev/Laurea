services:
  - type: web
    name: soutenances-api
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    # Déploiement déclenché par GitHub Actions, APRÈS la CI et les migrations
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false