version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"] #reste sur NestJS 11
    groups:
      nest: { patterns: ["@nestjs/*"] }
      prisma: { patterns: ["prisma", "@prisma/*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      vue: { patterns: ["vue", "vue-router", "pinia", "vue-tsc", "@vitejs/*"] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }