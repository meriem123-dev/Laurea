name: CD

# Chaque push sur main : CI complète - migrations - API (Render) - front (Vercel)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # ne jamais interrompre un déploiement en cours

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  migrate:
    name: Migrations Neon
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: prisma migrate deploy (connexion directe Neon)
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}

  deploy-api:
    name: Déploiement API (Render)
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Déclencher le déploiement Render
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      - name: "Attendre que l'API soit prête (Render gratuit : démarrage lent)"
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "$API_URL/health/ready"; then echo; echo "API prête"; exit 0; fi
            echo "tentative $i/40…"; sleep 15
          done
          echo "L'API n'est pas prête après 10 minutes" >&2
          exit 1
        env:
          API_URL: ${{ vars.API_URL }}

  deploy-front:
    name: Déploiement front (Vercel)
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # CLI lancée depuis la racine : le Root Directory "frontend" est lu dans les réglages du projet
      - run: npx --yes vercel@65.7.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel@65.7.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel@65.7.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}